{
  "kind": "app",
  "version": "0.4.0",
  "app": {
    "name": "报销材料预审-规则闭环",
    "description": "合成结构化申请→真实规则API→校验报告；不审批、不核定金额",
    "mode": "workflow",
    "icon": "🧾",
    "icon_background": "#E4FBCC",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "conversation_variables": [],
    "environment_variables": [
      {
        "id": "rules-url",
        "name": "RULES_API_URL",
        "value": "REPLACE_RULES_API_URL",
        "value_type": "string",
        "description": "内部规则服务地址",
        "selector": [
          "env",
          "RULES_API_URL"
        ]
      },
      {
        "id": "rules-token",
        "name": "RULES_API_TOKEN",
        "value": "",
        "value_type": "secret",
        "description": "仅供内部服务调用，不下发业务前端",
        "selector": [
          "env",
          "RULES_API_TOKEN"
        ]
      }
    ],
    "features": {
      "file_upload": {
        "enabled": false
      }
    },
    "graph": {
      "nodes": [
        {
          "id": "start",
          "type": "custom",
          "width": 244,
          "height": 100,
          "position": {
            "x": 0,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "start",
            "title": "结构化合成申请",
            "desc": "",
            "selected": false,
            "variables": [
              {
                "variable": "application_json",
                "label": "申请JSON（合成演示）",
                "type": "paragraph",
                "required": true,
                "max_length": 40000,
                "options": []
              }
            ]
          }
        },
        {
          "id": "rules",
          "type": "custom",
          "width": 244,
          "height": 100,
          "position": {
            "x": 320,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "http-request",
            "title": "调用可信规则API",
            "desc": "",
            "selected": false,
            "method": "post",
            "url": "{{#env.RULES_API_URL#}}/v1/prechecks",
            "authorization": {
              "type": "no-auth"
            },
            "headers": "Content-Type:application/json\nAuthorization:Bearer {{#env.RULES_API_TOKEN#}}",
            "params": "",
            "body": {
              "type": "raw-text",
              "data": [
                {
                  "key": "",
                  "type": "text",
                  "value": "{{#start.application_json#}}"
                }
              ]
            },
            "timeout": {
              "connect": 5,
              "read": 15,
              "write": 10
            },
            "ssl_verify": true,
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 100
            }
          }
        },
        {
          "id": "gate",
          "type": "custom",
          "width": 244,
          "height": 100,
          "position": {
            "x": 640,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "code",
            "title": "校验真实响应",
            "desc": "",
            "selected": false,
            "code_language": "python3",
            "code": "import json\ndef response_gate(status_code, body):\n    if status_code != 200:\n        raise ValueError('Rules API failed with HTTP '+str(status_code))\n    result = json.loads(body)\n    if not isinstance(result, dict) or result.get('is_precheck') is not True:\n        raise ValueError('Invalid precheck response')\n    if result.get('status') not in ('needs_manual_review', 'needs_materials', 'no_issues_found'):\n        raise ValueError('Invalid precheck status')\n    if not isinstance(result.get('findings'), list) or not isinstance(result.get('request_id'), str):\n        raise ValueError('Incomplete precheck response')\n    if 'approved_amount' in result:\n        raise ValueError('Unexpected settlement field')\n    return {'report_json': json.dumps(result, ensure_ascii=False), 'status': result['status'], 'request_id': result['request_id']}\n\ndef main(status_code, body):\n    return response_gate(status_code, body)\n",
            "variables": [
              {
                "variable": "status_code",
                "value_selector": [
                  "rules",
                  "status_code"
                ],
                "value_type": "number"
              },
              {
                "variable": "body",
                "value_selector": [
                  "rules",
                  "body"
                ],
                "value_type": "string"
              }
            ],
            "outputs": {
              "report_json": {
                "type": "string",
                "children": null
              },
              "status": {
                "type": "string",
                "children": null
              },
              "request_id": {
                "type": "string",
                "children": null
              }
            }
          }
        },
        {
          "id": "end",
          "type": "custom",
          "width": 244,
          "height": 100,
          "position": {
            "x": 960,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "data": {
            "type": "end",
            "title": "输出预审报告",
            "desc": "",
            "selected": false,
            "outputs": [
              {
                "variable": "report_json",
                "value_selector": [
                  "gate",
                  "report_json"
                ],
                "value_type": "string"
              },
              {
                "variable": "status",
                "value_selector": [
                  "gate",
                  "status"
                ],
                "value_type": "string"
              },
              {
                "variable": "request_id",
                "value_selector": [
                  "gate",
                  "request_id"
                ],
                "value_type": "string"
              }
            ]
          }
        }
      ],
      "edges": [
        {
          "id": "start-rules",
          "source": "start",
          "target": "rules",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "start",
            "targetType": "http-request",
            "isInIteration": false
          }
        },
        {
          "id": "rules-gate",
          "source": "rules",
          "target": "gate",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "http-request",
            "targetType": "code",
            "isInIteration": false
          }
        },
        {
          "id": "gate-end",
          "source": "gate",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "code",
            "targetType": "end",
            "isInIteration": false
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 0.7
      }
    }
  }
}
