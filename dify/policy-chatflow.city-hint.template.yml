            "title": "v1引用校验",
            "desc": "",
            "selected": false,
            "code_language": "python3",
            "code": "import re\nimport json\ndef guard(text, records, version):\n    \"\"\"Validate membership, not semantic entailment; manual answer review remains needed.\"\"\"\n    refusal = '现有检索依据不足，无法可靠回答，请补充信息或联系人工复核。'\n    allowed = set()\n    for record in records:\n        content = record.get('content', '')\n        ids = set(re.findall(r'TRAVEL-v\\d+-[A-Z]+', content))\n        if any(not item.startswith('TRAVEL-' + version + '-') for item in ids):\n            return {'answer': refusal}\n        allowed.update(ids)\n    try:\n        raw = text.strip()\n        if raw.startswith('```'):\n            raw = re.sub(r'^```(?:json)?\\s*|\\s*```$', '', raw)\n        obj = json.loads(raw)\n        refs = obj['clause_ids']\n        answer = obj['answer']\n        if obj['supported'] is not True or not isinstance(answer, str) or not answer.strip():\n            return {'answer': refusal}\n        if not isinstance(refs, list) or not refs or any(not isinstance(r, str) or r not in allowed for r in refs):\n            return {'answer': refusal}\n        mentioned = set(re.findall(r'TRAVEL-v\\d+-[A-Z]+', answer))\n        if not mentioned.issubset(set(refs)):\n            return {'answer': refusal}\n        return {'answer': answer + '\\n\\n依据：' + '、'.join(refs) + '（原创合成制度，仅供演示）'}\n    except (ValueError, KeyError, TypeError):\n        return {'answer': refusal}\n\ndef main(text, records):\n    return guard(text, records, 'v1')\n",
